<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="mb-0">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton [mat-dialog-close]="false">{{ data.cancelLabel }}</button>
  <button
    matButton="filled"
    [class.confirm--danger]="data.danger"
    [mat-dialog-close]="true"
    cdkFocusInitial
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
