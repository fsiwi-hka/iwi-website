<div class="sidebar">
  <div class="sidebar__brand d-flex align-items-center gap-2">
    <img class="sidebar__logo" ngSrc="images/iwi-logo.svg" width="32" height="32" alt="" priority />
    <div class="sidebar__brand-text d-flex flex-column">
      <span class="sidebar__name">Backrooms</span>
      <span class="sidebar__sub">Fachschaft IWI</span>
    </div>
    @if (showClose()) {
      <button
        matIconButton
        type="button"
        class="ms-auto"
        (click)="closeRequested.emit()"
        aria-label="Navigation schließen"
      >
        <mat-icon svgIcon="x" />
      </button>
    }
  </div>

  <nav class="sidebar__nav" aria-label="Hauptnavigation">
    @for (section of sections(); track section.label) {
      <mat-nav-list>
        <h3 matSubheader>{{ section.label }}</h3>
        @for (item of section.items; track item.path) {
          <a
            mat-list-item
            #link="routerLinkActive"
            [routerLink]="item.path"
            routerLinkActive
            ariaCurrentWhenActive="page"
            [activated]="link.isActive"
            (click)="navigated.emit()"
          >
            <mat-icon matListItemIcon [svgIcon]="item.icon" />
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    }
  </nav>

  @if (user(); as current) {
    <button
      type="button"
      class="sidebar__account"
      [matMenuTriggerFor]="accountMenu"
      [attr.aria-label]="'Konto: ' + current.displayName"
    >
      <span class="sidebar__avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="sidebar__account-text">
        <span class="sidebar__account-name">{{ current.displayName }}</span>
        <span class="sidebar__account-role">{{ roleLabel() }}</span>
      </span>
      <mat-icon class="sidebar__account-icon" svgIcon="log-out" />
    </button>

    <mat-menu #accountMenu="matMenu" yPosition="above">
      <button mat-menu-item type="button" (click)="logout.emit()">
        <mat-icon svgIcon="log-out" />
        <span>Abmelden</span>
      </button>
    </mat-menu>
  }
</div>
