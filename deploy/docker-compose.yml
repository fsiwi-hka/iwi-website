# Zwei Stacks laufen parallel auf demselben Host: Produktion (master) und
# Develop. Alles, was nur einmal existieren kann - Containername, Image-Tag und
# der veroeffentlichte Port - haengt deshalb an STACK_SUFFIX. Ohne gesetzte
# Variablen ergibt sich exakt die alte Produktionskonfiguration, damit ein
# blosses "docker compose up" lokal weiterhin funktioniert.
#
# Der Compose-Projektname (COMPOSE_PROJECT_NAME) trennt zusaetzlich Netzwerke
# und Volumes und wird vom Deploy-Workflow gesetzt.

services:
  web:
    build:
      context: ../ui
      dockerfile: Dockerfile
      secrets:
        - nextcloud_url
    image: iwi-website:${IMAGE_TAG:-latest}
    container_name: iwi-website${STACK_SUFFIX:-}
    restart: always
    environment:
      # Beide Stacks haengen am gemeinsamen npm-Netzwerk und tragen dort
      # denselben Compose-Alias "backend". Caddy bekommt darum den eindeutigen
      # Containernamen, sonst landen /api-Anfragen der Produktion unter
      # Umstaenden beim Develop-Backend.
      - BACKEND_HOST=iwi-backend${STACK_SUFFIX:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      - npm
    depends_on:
      - backend

  backend:
    build:
      context: ../api
      dockerfile: ./IWI-Backend.Api/Dockerfile
    image: iwi-backend:${IMAGE_TAG:-latest}
    container_name: iwi-backend${STACK_SUFFIX:-}
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Sync__CacheDirectory=/home/app/cache
      - Instagram__TokenFilePath=/home/app/state/instagram_token.json
      - Instagram__CacheDirectory=/home/app/instagram-cache
      - Protocols__CacheDirectory=/home/app/state
      - Instagram__AccessToken=${INSTAGRAM_TOKEN}
      - WebDav__Username=${WEBDAV_USERNAME}
      - WebDav__Password=${WEBDAV_PASSWORD}
      - Auth__Token=${AUTH_TOKEN}
      - OPhase__CacheDirectory=/home/app/cache/ophase
    user: "1654:1654"
    volumes:
      - media_cache:/home/app/cache
      - instagram_state:/home/app/state
      - instagram_cache:/home/app/instagram-cache
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5200}:8080"
    networks:
      - npm

volumes:
  media_cache:
  instagram_state:
  instagram_cache:

secrets:
  nextcloud_url:
    environment: NEXTCLOUD_URL

networks:
  npm:
    name: nginx-proxy-manager_default
    external: true
